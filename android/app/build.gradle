plugins {
    id 'com.android.application'
}

android {
    namespace 'app.fieldradio.walkie'
    compileSdk 34

    defaultConfig {
        applicationId "app.fieldradio.walkie"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 앱을 새로 만들어도 같은 서명이 되도록 고정 키를 씁니다 (덮어쓰기 설치가 가능해짐)
    signingConfigs {
        debug {
            storeFile file('radio-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
